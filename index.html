<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kevin Guiang">
  <title>Kevin Guiang</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }
    main { text-align: center; padding: 2rem 1.5rem; }
    h1 {
      margin: 0 0 2rem;
      font-size: 1.375rem;
      font-weight: 400;
    }
    nav ul { margin: 0; padding: 0; list-style: none; }
    nav li { margin: 0 0 0.75rem; }
    nav li:last-child { margin-bottom: 0; }
    nav a {
      color: #111;
      font-size: 1rem;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    nav a:hover, nav a:focus-visible { text-decoration-thickness: 2px; }
    nav a:focus-visible { outline: 2px solid #111; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Kevin Guiang</h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="https://kfguiang-spec.github.io/wset-tasting-guide/">Wine</a></li>
        <li><a href="/music/">Music</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
